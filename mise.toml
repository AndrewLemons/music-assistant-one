# Pinned developer and CI tools. `mise install` installs exactly these versions, verified
# against mise.lock. Xcode is not managed here; see CONTRIBUTING.md for the required version.
[tools]
actionlint = "1.7.12"
gitleaks = "8.30.1"
swiftformat = { version = "0.64.7", no_app = true, rename_exe = "swiftformat" }
swiftlint = "0.65.1"
uv = "0.13.8"
xcodegen = "2.46.0"
zizmor = "1.32.0"

[settings]
lockfile = true
experimental = true
