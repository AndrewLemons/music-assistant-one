name: MusicAssistantOne
options:
  bundleIdPrefix: com.lemonyclick.music-assistant-one
  deploymentTarget:
    iOS: '26.0'
    macOS: '26.0'
packages:
  MusicAssistantCore:
    path: Core
  SendspinKit:
    path: .dependencies/SendspinKit
configFiles:
  Debug: Config/Version.xcconfig
  Release: Config/Version.xcconfig
settings:
  base:
    SWIFT_VERSION: '6.0'
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    'LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]': '$(inherited) @executable_path/../Frameworks'
    'LD_RUNPATH_SEARCH_PATHS[sdk=iphone*]': '$(inherited) @executable_path/Frameworks'
targets:
  MusicAssistantOne:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - App
      - Shared
      - path: LICENSE
        buildPhase: resources
      - path: NOTICE
        buildPhase: resources
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
    dependencies:
      - package: MusicAssistantCore
      - package: SendspinKit
      - target: RemoteMediaExtension
        platformFilter: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ONE_BUNDLE_ID)
        PRODUCT_NAME: Music Assistant One
        INFOPLIST_FILE: App/Resources/Info.plist
        'CODE_SIGN_ENTITLEMENTS[sdk=iphone*]': App/Resources/RemotePlayback.entitlements
        'CODE_SIGN_ENTITLEMENTS[sdk=macosx*]': App/Resources/MusicAssistantOne.entitlements
        'ENABLE_HARDENED_RUNTIME[sdk=macosx*]': YES
        TARGETED_DEVICE_FAMILY: '1,2'
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: [MusicAssistantOneUITests, PlaybackTests]
  MusicAssistantOneUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS, macOS]
    sources: [UITests]
    dependencies:
      - target: MusicAssistantOne
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(ONE_BUNDLE_ID).uitests

  RemoteMediaExtension:
    type: extensionkit-extension
    platform: iOS
    deploymentTarget: '27.0'
    sources:
      - RemoteMedia
      - Shared
      - App/Services/CredentialStore.swift
    dependencies:
      - package: MusicAssistantCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ONE_BUNDLE_ID).remote-media
        INFOPLIST_FILE: RemoteMedia/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Resources/RemotePlayback.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

  PlaybackTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: '27.0'
    sources:
      - PlaybackTests
      - Shared
      - RemoteMedia/RemotePlaybackSession.swift
      - App/Services/CredentialStore.swift
    dependencies:
      - package: MusicAssistantCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(ONE_BUNDLE_ID).playbacktests
