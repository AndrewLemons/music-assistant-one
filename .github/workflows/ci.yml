name: CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: brew install swiftformat swiftlint gitleaks actionlint
      - name: Conventional PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/check-pr-title.py
      - run: make check secrets
  apple:
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: brew install xcodegen uv
      - run: make generate
      - name: Verify generated project is committed
        run: git diff --exit-code -- MusicAssistantOne.xcodeproj
      - run: make build-macos build-ios
      - name: Protocol compatibility (Release)
        run: python3 scripts/check-interop.py
      - name: Verify resolved dependency locks
        run: git diff --exit-code -- Integration/Package.resolved MusicAssistantOne.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
      - name: Simulator playback and UI tests
        run: python3 scripts/test-ios.py
      - name: Artwork threading regression
        run: |
          xcrun swiftc -swift-version 6 -parse-as-library App/Services/SystemMediaArtwork.swift scripts/check-system-artwork.swift -o /tmp/ma-one-artwork-check
          /tmp/ma-one-artwork-check
