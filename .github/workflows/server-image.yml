name: Server image
# Publishes the server image for a release tag. Release runs it after Release Please tags a
# release; run it manually to republish a tag, for example after a registry failure.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, such as v0.2.0
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: server-image-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Validate release tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Expected a vX.Y.Z release tag"; exit 1; }
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        id: checkout
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - name: Image tags
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/music-assistant-one-server"
          server="$(python3 scripts/server-image.py version)"
          tags=("$server-${TAG#v}")
          # Mirror upstream's stable tags, so replacing only the repository keeps a deployment's
          # channel. Republishing an older release must not move them back.
          if [[ "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" == "$TAG" ]]; then
            tags+=("$server" "${server%.*}" stable latest)
          fi
          {
            echo "name=$image"
            echo "version=${tags[0]}"
            echo "tags<<EOF"
            for tag in "${tags[@]}"; do echo "$image:$tag"; done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Test before publishing
        run: make test-server-image
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        id: build
        with:
          context: ServerCompanion
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          sbom: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
            org.opencontainers.image.revision=${{ steps.checkout.outputs.commit }}
          # GitHub Packages reads a multi-platform image's description from the index.
          annotations: |
            index:org.opencontainers.image.description=Music Assistant server with the Music Assistant One audio provider.
            index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            index:org.opencontainers.image.licenses=Apache-2.0
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          # Storage records require an organization-owned repository.
          create-storage-record: false
