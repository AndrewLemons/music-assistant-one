name: TEMP diagnose xcodebuild startup
on:
  push:
    branches: [ci/release-automation]
    paths: [.github/workflows/zz-diagnose.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.10.22
          install_args: xcodegen
      - run: make generate
      - name: Timings
        run: |
          set -x
          t() { local s=$SECONDS; "$@" > /tmp/out.txt 2>&1; echo "TIMING $(( SECONDS - s ))s: $*"; tail -3 /tmp/out.txt; }
          UDID=$(xcrun simctl list devices available --json | python3 -c "import json,sys,re;d=json.load(sys.stdin)['devices'];print([x['udid'] for k,v in sorted(d.items()) if re.search(r'iOS-27',k) for x in v if re.fullmatch(r'iPhone \d+ Pro',x['name'])][0])")
          t xcodebuild -version
          t xcrun xcdevice list --timeout 5
          t xcodebuild -project MusicAssistantOne.xcodeproj -scheme MusicAssistantOne -showdestinations
          t xcrun simctl boot "$UDID"
          t xcrun simctl bootstatus "$UDID" -b
          t xcodebuild -version
          t xcrun xcdevice list --timeout 5
          # Sample a slow xcodebuild startup to see what it waits on.
          xcodebuild -project MusicAssistantOne.xcodeproj -scheme MusicAssistantOne -showdestinations > /tmp/dest.txt 2>&1 &
          pid=$!; sleep 25; sample "$pid" 5 -file /tmp/sample.txt >/dev/null 2>&1 || true; s=$SECONDS; wait "$pid"; echo "TIMING showdestinations after boot: $((25 + SECONDS - s))s+"
          grep -E "^ {4,12}[0-9]+ " /tmp/sample.txt | sort -k1 -rn | head -40 || true
          t xcodebuild -project MusicAssistantOne.xcodeproj -scheme MusicAssistantOne -showdestinations
          t xcrun simctl spawn "$UDID" /usr/bin/true
