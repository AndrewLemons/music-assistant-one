version: 2
# Updates wait a week after an upstream release (supply-chain hygiene: most compromised
# releases are caught and yanked within days). Pinned developer tools in mise.toml are updated
# by .github/workflows/tools-update.yml with the same delay.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
  # Music Assistant releases. A server update publishes a new image, so it is a release-worthy fix.
  # Upstream ships patch releases quickly, so wait less than for tooling.
  - package-ecosystem: docker
    directory: /ServerCompanion
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    open-pull-requests-limit: 2
    commit-message:
      prefix: fix
      include: scope
  # Companion test dependencies, used only by tests.
  - package-ecosystem: pip
    directory: /ServerCompanion
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      companion-tests:
        patterns: ["*"]
    commit-message:
      prefix: test
      include: scope
